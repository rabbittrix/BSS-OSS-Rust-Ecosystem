[package]
name = "telecom-dashboard"
version = "0.1.0"
description = "Tauri desktop dashboard for BSS/OSS telecom product suite"
authors = ["Roberto de Souza <rabbittrix@hotmail.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "telecom_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
once_cell = "1"
telecom-product-engine = { path = "../../../crates/telecom-product-engine", version = "0.1.0" }

[workspace]
